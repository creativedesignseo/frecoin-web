name: Deploy a Hostinger via FTP

# Cuándo se ejecuta:
# - Cada push a main (deploy automático)
# - Manualmente desde el panel de Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# Secrets necesarios en el repo (Settings → Secrets and variables → Actions):
# - FTP_HOST     → host FTP de Hostinger (ej: ftp.frecoin.es o 145.14.xxx.xxx)
# - FTP_USERNAME → usuario FTP de Hostinger
# - FTP_PASSWORD → contraseña FTP de Hostinger
# - FTP_PORT     → 21 (FTP estándar) o 22 (SFTP) — Hostinger usa 21 por defecto
# - FTP_SERVER_DIR → directorio remoto donde van los archivos
#                    (ej: /public_html/ o /domains/frecoin.es/public_html/)
# - VITE_GTM_ID  → opcional, GTM-XXXXXXX (vacío si aún no se tiene)
# - VITE_GA4_ID  → opcional, G-XXXXXXXXXX (vacío si aún no se tiene)

jobs:
  build-and-deploy:
    name: Build y subida FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build producción
        env:
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
        run: npm run build

      - name: Verificar que .htaccess está en dist/
        run: |
          if [ ! -f dist/.htaccess ]; then
            echo "ERROR: dist/.htaccess no existe. ¿Está public/.htaccess en su sitio?"
            exit 1
          fi
          echo "✓ .htaccess presente"

      - name: Deploy a Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Borrar archivos remotos que ya no existen localmente (deploy limpio)
          dangerous-clean-slate: false
          # Excluir cosas que nunca queremos subir
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Resumen del deploy
        run: |
          echo "✅ Deploy completado."
          echo "URL: comprobar el subdominio configurado en Hostinger."
